    const storageKey = "rps-plus-playtest-password";
    const form = document.querySelector("#gate");
    const input = document.querySelector("#password");
    const button = document.querySelector("#unlock");
    const error = document.querySelector("#error");

    function decodeBase64(value) {
      return Uint8Array.from(atob(value), character => character.charCodeAt(0));
    }

    async function decrypt(password) {
      const material = await crypto.subtle.importKey(
        "raw",
        new TextEncoder().encode(password),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      const key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: decodeBase64(payload.salt), iterations: payload.iterations, hash: "SHA-256" },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: decodeBase64(payload.iv), tagLength: 128 },
        key,
        decodeBase64(payload.data)
      );
      return new TextDecoder().decode(plaintext);
    }

    async function unlock(password) {
      button.disabled = true;
      button.textContent = "Unlocking…";
      error.textContent = "";
      try {
        const html = await decrypt(password);
        sessionStorage.setItem(storageKey, password);
        document.open();
        document.write(html);
        document.close();
      } catch {
        sessionStorage.removeItem(storageKey);
        input.value = "";
        error.textContent = "That password did not work.";
        button.disabled = false;
        button.textContent = "Unlock playtest";
        input.focus();
      }
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      unlock(input.value);
    });

    const rememberedPassword = sessionStorage.getItem(storageKey);
    if (rememberedPassword) unlock(rememberedPassword);
