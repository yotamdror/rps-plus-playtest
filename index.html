    async function unlock(password) {
      button.disabled = true;
      button.textContent = "Unlocking…";
      error.textContent = "";
      try {
        const html = await decrypt(password);
        sessionStorage.setItem(storageKey, password);
        document.open();
        document.write(html);
        document.close();
      } catch {
        sessionStorage.removeItem(storageKey);
        input.value = "";
        error.textContent = "That password did not work.";
        button.disabled = false;
        button.textContent = "Unlock playtest";
        input.focus();
      }
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      unlock(input.value);
    });

    const rememberedPassword = sessionStorage.getItem(storageKey);
    if (rememberedPassword) unlock(rememberedPassword);
  </script>
</body>
</html>
